<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">UNPS HiveForge</title>
  <desc id="desc">A dark purple Unparalleled Source banner with a luminous teal and magenta hive-forge mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080210"/>
      <stop offset="0.56" stop-color="#240725"/>
      <stop offset="1" stop-color="#4B0F4E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4AA"/>
      <stop offset="1" stop-color="#C35BA3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00D4AA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="72" height="62" patternUnits="userSpaceOnUse">
      <path d="M18 1h36l18 30-18 30H18L0 31Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1440" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="36" fill="url(#grid)"/>
  <circle cx="1160" cy="250" r="300" fill="url(#halo)"/>
  <circle cx="185" cy="52" r="165" fill="#C35BA3" opacity="0.09" filter="url(#soft)"/>

  <g transform="translate(965 92)">
    <path d="M170 8h112l56 96-56 96H170l-56-96Z" fill="#00D4AA" opacity="0.08" stroke="#00D4AA" stroke-width="3"/>
    <path d="M58 200h112l56 96-56 96H58L2 296Z" fill="#C35BA3" opacity="0.08" stroke="#C35BA3" stroke-width="3"/>
    <path d="M282 200h112l56 96-56 96H282l-56-96Z" fill="#00D4AA" opacity="0.06" stroke="#00D4AA" stroke-width="3"/>
    <path d="M170 200h112l56 96-56 96H170l-56-96Z" fill="url(#glow)" opacity="0.92"/>
    <path d="M199 296l27-46h54l27 46-27 46h-54Z" fill="#080210"/>
    <path d="M226 250l54 92M280 250l-54 92" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.88"/>
    <circle cx="253" cy="296" r="10" fill="#FFFFFF"/>
  </g>

  <g transform="translate(94 105)">
    <text x="0" y="38" fill="#00D4AA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="6">UNPARALLELED SOURCE</text>
    <text x="0" y="154" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">HiveForge</text>
    <rect x="2" y="183" width="560" height="4" rx="2" fill="url(#glow)"/>
    <text x="0" y="242" fill="#FFFFFF" opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="28">Reusable intelligence. Portable agents.</text>
    <text x="0" y="284" fill="#FFFFFF" opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="28">Verified execution.</text>
    <g transform="translate(0 332)">
      <rect width="226" height="48" rx="24" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="27" cy="24" r="7" fill="#00D4AA"/>
      <text x="48" y="31" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18">Candidate v0.3.0</text>
    </g>
  </g>
