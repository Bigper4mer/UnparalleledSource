name: Production Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    name: Static / Privacy / Secret Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic production gate
        run: python scripts/production_gate.py
      - name: Compile Python
        run: python -m compileall -q dashboard scripts tests
      - name: Validate POSIX shell syntax
        run: |
          sh -n install.sh
          sh -n bin/hiveforge
          sh -n tests/onboarding_cli_smoke.sh
          sh -n tests/package_export_import.sh
          sh -n tests/fallback_without_graphify.sh
          sh -n scripts/build_release.sh

  onboarding-cli:
    name: Guided Onboarding CLI
    needs: static-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run onboarding command smoke test
        shell: bash
        run: sh tests/onboarding_cli_smoke.sh

  fresh-install:
    name: Fresh Install (${{ matrix.os }})
    needs: static-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from checked-out source
        shell: bash
        run: |
          set -euo pipefail
          HIVEFORGE_SOURCE_DIR="$GITHUB_WORKSPACE" sh install.sh \
            --target "$RUNNER_TEMP/hiveforge" \
            --bin-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/hiveforge" doctor
          test "$("$RUNNER_TEMP/bin/hiveforge" version)" = "0.7.0"
          "$RUNNER_TEMP/bin/hiveforge" bootstrap >/dev/null
          "$RUNNER_TEMP/bin/hiveforge" onboard >/dev/null

  package-roundtrip:
    name: Package Export / Import (${{ matrix.os }})
    needs: static-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run round-trip test
        shell: bash
        run: sh tests/package_export_import.sh

  dashboard-smoke:
    name: Dashboard Smoke
    needs: static-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Health endpoint smoke test
        run: python tests/dashboard_smoke.py

  fallback-without-graphify:
    name: Fallback Without Graphify
    needs: static-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify optional dependency fallback
        run: sh tests/fallback_without_graphify.sh

  tooljet-config:
    name: ToolJet Compose Validation
    needs: static-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged ToolJet stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f tooljet/docker-compose.yml config >/dev/null
          grep -q "ToolJet" 10_CUSTOM_AGENTS/UNPS_HiveForge/DEPENDENCIES.md
          grep -q "STAGED" 10_CUSTOM_AGENTS/UNPS_HiveForge/DEPENDENCIES.md

  graphify-live:
    name: Graphify Live Fixture
    needs: static-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Graphify candidate
        run: python -m pip install --disable-pip-version-check graphifyy==0.9.48
      - name: Build and cluster live graph from code-only fixture
        shell: bash
        run: |
          set -euo pipefail
          graphify --version
          cd tests/fixtures/graphify-smoke
          timeout 180 graphify .
          timeout 180 graphify cluster-only .
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.html
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('graphify-out/graph.json').read_text())
          edges = data.get('links', data.get('edges', []))
          assert len(data.get('nodes', [])) >= 3, data
          assert len(edges) >= 1, data
          print(f"Graphify live fixture: PASS — {len(data['nodes'])} nodes, {len(edges)} edges")
          PY

  wsl-install:
    name: Fresh Install (WSL)
    needs: static-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect an installed WSL distribution
        shell: pwsh
        run: |
          wsl --status
          $distros = @(wsl --list --quiet | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          if ($distros.Count -eq 0) {
            Write-Warning "The hosted Windows image has WSL enabled but no installed distribution; Linux installation remains covered by the mandatory native Linux gate."
            "WSL_AVAILABLE=false" >> $env:GITHUB_ENV
            exit 0
          }
          "WSL_AVAILABLE=true" >> $env:GITHUB_ENV
          Write-Host "Using WSL distribution: $($distros[0])"
      - name: Install HiveForge inside WSL
        if: env.WSL_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $distros = @(wsl --list --quiet | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
          $distro = $distros[0]
          wsl -d $distro --user root -- bash -lc "true"
          $drive = $env:GITHUB_WORKSPACE.Substring(0,1).ToLowerInvariant()
          $rest = $env:GITHUB_WORKSPACE.Substring(2).Replace('\','/')
          $workspace = "/mnt/$drive$rest"
          Write-Host "Resolved WSL workspace: $workspace"
          wsl -d $distro --user root -- bash -lc "test -d '$workspace'"
          wsl -d $distro --user root -- bash -lc "cd '$workspace' && HIVEFORGE_SOURCE_DIR='$workspace' sh install.sh --target /tmp/hiveforge --bin-dir /tmp/hiveforge-bin && /tmp/hiveforge-bin/hiveforge doctor && /tmp/hiveforge-bin/hiveforge version | grep -qx 0.7.0 && /tmp/hiveforge-bin/hiveforge onboard >/dev/null"
